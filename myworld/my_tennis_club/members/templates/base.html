
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Blog{% endblock %}</title>
</head>
<body>
  <h1>{% block header %}Blog{% endblock %}</h1>

  <hr>

  {% block content %}
  <form method="post">
    {% csrf_token %}
    <p>
      <label for="title">Title:</label><br>
      <input type="text" id="title" name="title">
    </p>

    <p>
      <label for="body">What I thought:</label><br>
      <textarea id="body" name="body" rows="10" cols="50"></textarea>
    </p>

    <button type="submit">Post</button>
  </form>
  {% endblock %}

  <hr>
  <footer>
  </footer>
</body>
</html>
